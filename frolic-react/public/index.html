<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frolic Celebrations</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      /* ── Global ── */
      * { box-sizing: border-box; }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0a0a1a;
        color: #e0e0e0;
        min-height: 100vh;
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0a0a1a; }
      ::-webkit-scrollbar-thumb { background: #6c63ff; border-radius: 3px; }

      /* ── Navbar ── */
      .frolic-navbar {
        background: rgba(10, 10, 30, 0.95) !important;
        border-bottom: 1px solid rgba(108, 99, 255, 0.3);
        backdrop-filter: blur(10px);
        padding: 12px 0;
      }
      .frolic-navbar .navbar-brand {
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #6c63ff, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .frolic-navbar .nav-link {
        color: #ccc !important;
        font-weight: 500;
        padding: 6px 14px !important;
        transition: color 0.2s;
      }
      .frolic-navbar .nav-link:hover { color: #a78bfa !important; }

      /* ── Hero ── */
      .hero-section {
        min-height: 100vh;
        background: linear-gradient(135deg, #0a0a1a 0%, #1a0a3a 50%, #0d1a3a 100%);
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
      }
      .hero-section::before {
        content: '';
        position: absolute;
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(108,99,255,0.15) 0%, transparent 70%);
        top: -100px;
        right: -100px;
        border-radius: 50%;
      }
      .hero-title {
        font-size: clamp(2.5rem, 6vw, 5rem);
        font-weight: 900;
        letter-spacing: 4px;
        background: linear-gradient(135deg, #ffffff, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .hero-subtitle { color: #9ca3af; font-size: 1.1rem; line-height: 1.8; }

      /* ── Section Titles ── */
      .section-title {
        font-size: 2rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 1px;
      }
      .section-title span {
        background: linear-gradient(135deg, #6c63ff, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* ── Department Badge ── */
      .dept-badge {
        display: inline-block;
        background: linear-gradient(135deg, #6c63ff, #8b5cf6);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 4px 14px;
        border-radius: 20px;
        margin-bottom: 20px;
      }

      /* ── Event Card ── */
      .event-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(108,99,255,0.2);
        border-radius: 16px;
        overflow: hidden;
        transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
        height: 100%;
      }
      .event-card:hover {
        transform: translateY(-6px);
        border-color: rgba(108,99,255,0.6);
        box-shadow: 0 12px 40px rgba(108,99,255,0.2);
      }
      .event-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }
      .event-card .card-body { padding: 20px; }
      .event-card .card-text { color: #9ca3af; font-size: 0.9rem; line-height: 1.6; }

      /* ── Buttons ── */
      .btn-primary-custom {
        background: linear-gradient(135deg, #6c63ff, #8b5cf6);
        border: none;
        color: #fff;
        padding: 10px 24px;
        border-radius: 8px;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: opacity 0.2s, transform 0.2s;
      }
      .btn-primary-custom:hover { opacity: 0.88; transform: translateY(-1px); color:#fff; }

      .btn-outline-custom {
        border: 1px solid rgba(108,99,255,0.5);
        color: #a78bfa;
        background: transparent;
        padding: 10px 24px;
        border-radius: 8px;
        font-weight: 600;
        transition: background 0.2s;
      }
      .btn-outline-custom:hover { background: rgba(108,99,255,0.1); color: #a78bfa; }

      /* ── Auth Card ── */
      .auth-wrapper {
        min-height: 100vh;
        background: linear-gradient(135deg, #0a0a1a, #1a0a3a);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .auth-card {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(108,99,255,0.25);
        border-radius: 20px;
        padding: 40px;
        width: 100%;
        max-width: 440px;
        backdrop-filter: blur(10px);
      }
      .auth-card h2 {
        font-weight: 800;
        font-size: 1.8rem;
        color: #fff;
        margin-bottom: 6px;
      }
      .auth-card p { color: #9ca3af; font-size: 0.9rem; }

      /* ── Form Controls ── */
      .form-control-custom {
        background: rgba(255,255,255,0.07) !important;
        border: 1px solid rgba(108,99,255,0.3) !important;
        color: #e0e0e0 !important;
        border-radius: 10px !important;
        padding: 12px 16px !important;
      }
      .form-control-custom::placeholder { color: #6b7280 !important; }
      .form-control-custom:focus {
        border-color: #6c63ff !important;
        box-shadow: 0 0 0 3px rgba(108,99,255,0.15) !important;
        background: rgba(255,255,255,0.09) !important;
      }
      .form-label-custom { color: #d1d5db; font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
      .form-select-custom {
        background: rgba(255,255,255,0.07) !important;
        border: 1px solid rgba(108,99,255,0.3) !important;
        color: #e0e0e0 !important;
        border-radius: 10px !important;
        padding: 12px 16px !important;
      }
      .form-select-custom option { background: #1a0a3a; }

      /* ── Dashboard ── */
      .dashboard-sidebar {
        background: rgba(255,255,255,0.04);
        border-right: 1px solid rgba(108,99,255,0.2);
        min-height: calc(100vh - 65px);
        padding: 24px 0;
      }
      .sidebar-link {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #9ca3af;
        text-decoration: none;
        padding: 10px 20px;
        font-weight: 500;
        transition: all 0.2s;
        border-left: 3px solid transparent;
      }
      .sidebar-link:hover, .sidebar-link.active {
        color: #a78bfa;
        background: rgba(108,99,255,0.1);
        border-left-color: #6c63ff;
      }
      .stat-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(108,99,255,0.2);
        border-radius: 14px;
        padding: 24px;
        transition: border-color 0.2s;
      }
      .stat-card:hover { border-color: rgba(108,99,255,0.5); }
      .stat-card .stat-number { font-size: 2rem; font-weight: 800; color: #fff; }
      .stat-card .stat-label { color: #9ca3af; font-size: 0.85rem; }
      .stat-card .stat-change { color: #4ade80; font-size: 0.8rem; }

      /* ── Table ── */
      .table-custom {
        color: #e0e0e0 !important;
      }
      .table-custom thead th {
        background: rgba(108,99,255,0.15) !important;
        color: #a78bfa !important;
        border: none !important;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 14px 16px;
      }
      .table-custom tbody tr {
        border-bottom: 1px solid rgba(255,255,255,0.06) !important;
        transition: background 0.15s;
      }
      .table-custom tbody tr:hover { background: rgba(108,99,255,0.07) !important; }
      .table-custom td { padding: 14px 16px !important; vertical-align: middle !important; border: none !important; }

      /* ── Modal ── */
      .modal-custom .modal-content {
        background: #12122a;
        border: 1px solid rgba(108,99,255,0.3);
        border-radius: 16px;
        color: #e0e0e0;
      }
      .modal-custom .modal-header {
        border-bottom: 1px solid rgba(108,99,255,0.2);
        padding: 20px 24px;
      }
      .modal-custom .modal-title { font-weight: 700; color: #fff; }
      .modal-custom .btn-close { filter: invert(1); }

      /* ── Badge Status ── */
      .badge-active { background: rgba(74,222,128,0.15); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
      .badge-inactive { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
      .badge-pending { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }

      /* ── Footer ── */
      .frolic-footer {
        background: rgba(255,255,255,0.02);
        border-top: 1px solid rgba(108,99,255,0.15);
        padding: 20px;
        text-align: center;
        color: #6b7280;
        font-size: 0.85rem;
      }
      .frolic-footer span { color: #ef4444; }

      /* ── Results Page ── */
      .winner-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(108,99,255,0.2);
        border-radius: 16px;
        padding: 30px 20px;
        text-align: center;
        transition: transform 0.25s;
      }
      .winner-card:hover { transform: translateY(-5px); }
      .winner-card.gold { border-color: rgba(255,215,0,0.4); }
      .winner-card.silver { border-color: rgba(192,192,192,0.4); }
      .winner-card.bronze { border-color: rgba(205,127,50,0.4); }
      .winner-card img.trophy { width: 70px; margin-bottom: 12px; }
      .winner-card img.avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(108,99,255,0.4); margin-bottom: 10px; }
      .winner-card .rank-text { font-weight: 800; font-size: 1.1rem; }
      .rank-gold { color: #ffd700; }
      .rank-silver { color: #c0c0c0; }
      .rank-bronze { color: #cd7f32; }

      /* ── Payment Page ── */
      .payment-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(108,99,255,0.2);
        border-radius: 16px;
        padding: 28px;
      }
      .payment-method-btn {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(108,99,255,0.25);
        border-radius: 10px;
        padding: 14px 20px;
        color: #e0e0e0;
        cursor: pointer;
        transition: all 0.2s;
        width: 100%;
        text-align: left;
      }
      .payment-method-btn.selected, .payment-method-btn:hover {
        border-color: #6c63ff;
        background: rgba(108,99,255,0.12);
      }

      /* ── Participation ── */
      .group-item {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(108,99,255,0.2);
        border-radius: 12px;
        padding: 16px 20px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* ── Event Detail ── */
      .event-detail-hero {
        background: linear-gradient(135deg, #1a0a3a, #0d1a3a);
        border-bottom: 1px solid rgba(108,99,255,0.2);
        padding: 60px 0 40px;
      }
      .event-detail-hero h1 {
        font-weight: 900;
        font-size: 2.5rem;
        color: #fff;
      }
      .info-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(108,99,255,0.15);
        border: 1px solid rgba(108,99,255,0.3);
        border-radius: 20px;
        padding: 5px 14px;
        font-size: 0.82rem;
        color: #a78bfa;
        margin: 4px 4px 4px 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
